###############################################################################
# general settings              					      #
###############################################################################

# set scroll history to 100,000 lines
set-option -g history-limit 100000

# prefix key
set -g prefix C-f
unbind C-b
bind C-f send-prefix

# keys
bind k confirm kill-window
bind K confirm kill-server
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind < resize-pane -L 3
bind > resize-pane -R 3
bind - resize-pane -D 3
bind + resize-pane -U 3
bind . command-prompt
bind a last-window
bind -r C-p swap-window -t -1\; select-window -t -1
bind -r C-n swap-window -t +1\; select-window -t +1

# fix titlebar
set -g set-titles on
set -g set-titles-string "#T"

# start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# new window in current path
bind c new-window -a -c "#{pane_current_path}"

# pane navigation
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r Up select-pane -U
bind -r Down select-pane -D

# message display time
set -g display-time 2000

# vim mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# clipboard over ssh/remote via OSC 52
set -s set-clipboard on

# mouse friendly
set -g mouse on

###############################################################################
# design changes							      #
###############################################################################

# modern colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'

# for neovim
set-option -sg escape-time 10
set-option -sg focus-events on

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# statusbar
set-option -g status-style fg=white,bg=colour23
set -g status-left " #S "
set -g status-left-length 30
set -g status-right " #h  %b %d  %H:%M "
set -g status-right-length 40
set -g status-interval 5

# window title colors
set-window-option -g window-status-style fg=colour244
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-style fg=colour73

# pane border
set-option -g pane-border-style fg=colour8
set-option -g pane-active-border-style fg=colour23

# message text
set-option -g message-style fg=colour73,bg=colour23

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour73 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# bell
set-window-option -g window-status-bell-style fg=colour23,bg=colour160 #base02, red

# update env vars when reattaching
set -g update-environment "SSH_CLIENT SSH_CONNECTION SSH_TTY DISPLAY"
